# Render Blueprint — deploys the FixIt backend as a web service.
# Database should be provisioned separately (Supabase with PostGIS recommended).
#
# Required environment variables (set in Render dashboard):
#   DATABASE_URL          — PostgreSQL connection string (with PostGIS)
#   FIREBASE_PROJECT_ID   — Firebase project ID
#   FIREBASE_CLIENT_EMAIL — Firebase service account email
#   FIREBASE_PRIVATE_KEY  — Firebase service account private key (with \n newlines)
#   GOOGLE_MAPS_API_KEY   — Google Maps API key (for geocoding/directions)
#   PORT                  — Set automatically by Render
#   NODE_ENV              — production

services:
  - type: web
    name: fixit-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /health
